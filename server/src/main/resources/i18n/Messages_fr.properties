page_title=Hammer
home_servermessage=Message du serveur
home_servermessage_whitelist=Ce serveur exige que vous obteniez une autorisation avant de créer un compte. Veuillez contacter {0} pour être ajouté à la liste blanche.
home_whatishammer_title=Qu'est-ce que Hammer ?
home_whatishammer_subtitle=Hammer est un outil open source pour écrire des histoires et les mondes dans lesquels elles existent.
home_feature_multiplatform_header=Multiplateforme
home_feature_multiplatform_body=Emportez cette application partout — sur votre téléphone, tablette, ordinateur de bureau ou portable. Ce n'est pas un simple site web encapsulé. Elle utilise des technologies natives côté client pour offrir la meilleure expérience possible.
home_feature_multiscreen_header=Multi-écran
home_feature_multiscreen_body=Que vous soyez sur un téléphone, une tablette ou un ordinateur, Hammer exploite au mieux l'espace de votre écran, en s'étendant pour vous donner de la place pour travailler. Prend aussi en charge les modes clair et sombre.
home_feature_offlinefirst_header=Hors ligne d'abord
home_feature_offlinefirst_body=Hammer est conçu dès le départ pour être entièrement local, sans jamais nécessiter de connexion Internet. Vous pouvez synchroniser avec un serveur, auto-hébergé ou hébergé par un tiers comme hammer.ink. Mais c'est entièrement facultatif.
home_feature_transparentdata_header=Données transparentes
home_feature_transparentdata_body=Vos données vous appartiennent. Elles ne sont pas stockées dans le cloud ni dans une base de données opaque. Elles sont enregistrées dans des fichiers simples et lisibles, la structure du projet étant définie par de simples fichiers et dossiers. Vous pouvez ouvrir l'explorateur de fichiers de votre système et y jeter un œil vous-même. Si ce programme disparaissait aujourd'hui, vous pourriez continuer à consulter facilement vos données.
