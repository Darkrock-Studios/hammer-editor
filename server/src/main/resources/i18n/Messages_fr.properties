home_feature_multiplatform_body=Cette application que vous emportez \u2014 sur votre t\u00E9l\u00E9phone, tablette, ordinateur de bureau ou ordinateur portable. Elle peut \u00EAtre install\u00E9e et fonctionner, et n'est pas simplement un site Web dans une bo\u00EEte, mais utilise des technologies c\u00F4t\u00E9 client native pour fournir la meilleure exp\u00E9rience possible.
home_feature_multiplatform_header=Multiplateforme
home_feature_multiscreen_body=Que vous soyez sur un t\u00E9l\u00E9phone, une tablette ou un ordinateur de bureau, Hammer fera le meilleur usage de votre espace \u00E9cran. Prend aussi en charge les modes clair et sombre.
