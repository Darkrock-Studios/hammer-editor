# Detailed Features
home_detail_scenes_title=Écrire en scènes
home_detail_scenes_body=Découpez votre histoire en scènes plus petites. Prenez des notes à côté, rédigez un court résumé pour visualiser votre histoire en mode plan.
home_detail_organize_title=Organisez vos scènes
home_detail_organize_body=Besoin que deux personnages se rencontrent plus tôt ? Glissez-déposez simplement vos scènes pour changer leur ordre.
home_detail_drafts_title=Utilisez des brouillons de vos scènes
home_detail_drafts_body=Enregistrez un brouillon avant une réécriture majeure de votre scène. Les changements importants deviennent moins effrayants, car vous pouvez toujours revenir en arrière.
home_detail_timeline_title=Établissez votre chronologie
home_detail_timeline_body=Utilisez la fonction de chronologie pour visualiser le déroulement de votre intrigue, ou même de votre monde.
home_detail_encyclopedia_title=Rédigez votre encyclopédie
home_detail_encyclopedia_body=Créez des entrées pour vos personnages, lieux, événements, tout ce qui vous vient à l'esprit. Ajoutez des images pour capturer mille mots.
home_detail_notes_title=Notes
home_detail_notes_body=Besoin de noter une idée rapide sur votre histoire ou votre monde ? Jetez-la dans la section des notes.
