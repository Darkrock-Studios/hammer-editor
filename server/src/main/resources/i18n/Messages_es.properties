home_feature_multiplatform_body=Esta aplicaci\u00F3n se puede llevar en el tel\u00E9fono, la tableta, el ordenador de sobremesa o el port\u00E1til. Se puede instalar y ejecutar, y no es simplemente un sitio web en una caja, sino que utiliza tecnolog\u00EDas nativas del lado del cliente para ofrecer la mejor experiencia posible.
home_feature_multiplatform_header=Multiplataforma
home_feature_multiscreen_body=Tanto si est\u00E1s en un tel\u00E9fono, una tableta o un ordenador de sobremesa, Hammer aprovechar\u00E1 al m\u00E1ximo el espacio de tu pantalla. Tambi\u00E9n es compatible con los modos claro y oscuro.
