home_servermessage=Mensaje del servidor
home_servermessage_whitelist=Este servidor requiere que obtengas permiso antes de crear una cuenta. Ponte en contacto con {0} para entrar en la lista blanca.
home_whatishammer_title=¿Qué es Hammer?
home_whatishammer_subtitle=Hammer es una herramienta de código abierto para escribir historias y los mundos en los que existen.
home_feature_multiplatform_header=Multiplataforma
home_feature_multiplatform_body=Lleva esta aplicación a cualquier parte\: en tu teléfono, tableta, ordenador de sobremesa o portátil. No es simplemente un sitio web enlatado. Usa tecnologías nativas del lado del cliente para ofrecer la mejor experiencia posible.
home_feature_multiscreen_header=Multipantalla
home_feature_multiscreen_body=Ya sea en un teléfono, una tableta o un ordenador, Hammer aprovecha al máximo el espacio de tu pantalla, expandiéndose para darte sitio para trabajar. También admite los modos claro y oscuro.
home_feature_offlinefirst_header=Sin conexión primero
home_feature_offlinefirst_body=Hammer está diseñado desde cero para ser totalmente local, sin necesidad de conexión a internet, nunca. Puedes sincronizar con un servidor, ya sea autoalojado o alojado por un tercero como hammer.ink. Pero es totalmente opcional.
home_feature_transparentdata_header=Datos transparentes
home_feature_transparentdata_body=Tus datos son tuyos. No se almacenan en la nube ni en alguna base de datos opaca. Se guardan en archivos sencillos y legibles, usando solo archivos y carpetas para definir la estructura del proyecto. Puedes abrir el explorador de archivos de tu sistema y echar un vistazo tú mismo. Si este programa desapareciera hoy, podrías seguir interactuando fácilmente con tus datos.
