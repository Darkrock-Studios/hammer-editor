# Detailed Features
home_detail_scenes_title=Escribe por escenas
home_detail_scenes_body=Divide tu historia en escenas más pequeñas. Toma notas al lado, escribe un breve resumen para ver tu historia en el modo esquema.
home_detail_organize_title=Organiza tus escenas
home_detail_organize_body=¿Necesitas que dos personajes se encuentren antes? Simplemente arrastra y suelta tus escenas para cambiar su orden.
home_detail_drafts_title=Usa borradores de tus escenas
home_detail_drafts_body=Guarda un borrador antes de una reescritura importante de tu escena. Esto hace que los grandes cambios den menos miedo, porque siempre puedes volver atrás.
home_detail_timeline_title=Traza tu cronología
home_detail_timeline_body=Usa la función de cronología para visualizar el desarrollo de tu trama o incluso de tu mundo.
home_detail_encyclopedia_title=Escribe tu enciclopedia
home_detail_encyclopedia_body=Crea entradas para tus personajes, lugares, eventos, todo lo que se te ocurra. Añade imágenes para capturar mil palabras.
home_detail_notes_title=Notas
home_detail_notes_body=¿Necesitas apuntar una idea rápida sobre tu historia o tu mundo? Lánzala a la sección de notas.
