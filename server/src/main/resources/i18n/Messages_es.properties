home_feature_offlinefirst_header=Multipantalla
home_feature_transparentdata_body=Tus datos son tuyos. No se almacenan en la nube, ni en ninguna base de datos opaca. Se almacenan en archivos simples, legibles por humanos, utilizando s\u00F3lo archivos y carpetas para definir la estructura del proyecto. Puedes abrir el explorador de archivos de tu sistema operativo y echar un vistazo por ti mismo. Si este programa desapareciera hoy ser\u00EDas capaz de interactuar f\u00E1cilmente con tus datos.
