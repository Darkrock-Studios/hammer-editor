home_feature_multiplatform_body=Ця програма, яку ви берете із собою — на вашому телефоні, планшеті, настільному комп'ютері чи ноутбуці. Її можна встановити та запускати, і це не просто вебсайт у коробці, а замість цього використовує рідні технології клієнтської сторони для надання найкращого можливого досвіду.
home_feature_multiplatform_header=Багатоплатформний
home_feature_multiscreen_body=Незалежно від того, чи ви на телефоні, планшеті чи настільному комп'ютері, Hammer максимально ефективно використовуватиме простір вашого екрану. Також підтримує як світлий, так і темний режими.
home_feature_multiscreen_header=Багатоекранний
home_feature_offlinefirst_body=Незалежно від того, чи ви на телефоні, планшеті чи настільному комп'ютері, Hammer максимально ефективно використовуватиме ваш екран. Також підтримує як світлий, так і темний режими.
home_feature_offlinefirst_header=Багатоекранний
home_feature_transparentdata_body=Ваші дані - це ваші дані. Вони не зберігаються в хмарі чи в якійсь непрозорій базі даних. Вони зберігаються у простих, зрозумілих для людини файлах, лише за допомогою файлів і папок для визначення структури проєкту. Ви можете відкрити файловий браузер вашої ОС і подивитися самі. Якщо ця програма зникне сьогодні, ви зможете легко взаємодіяти зі своїми даними.
