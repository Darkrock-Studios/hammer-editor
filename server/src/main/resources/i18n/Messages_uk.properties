home_servermessage=Повідомлення сервера
home_servermessage_whitelist=Цей сервер вимагає отримати дозвіл перед створенням облікового запису. Будь ласка, зверніться до {0}, щоб потрапити до білого списку.
home_whatishammer_title=Що таке Hammer?
home_whatishammer_subtitle=Hammer — це інструмент із відкритим кодом для написання історій і світів, у яких вони існують.
home_feature_multiplatform_header=Багатоплатформність
home_feature_multiplatform_body=Беріть цей застосунок будь-куди — на телефон, планшет, настільний чи портативний комп’ютер. Це не просто сайт у коробці. Він використовує рідні технології на боці клієнта, щоб надати найкращий можливий досвід.
home_feature_multiscreen_header=Багатоекранність
home_feature_multiscreen_body=Незалежно від того, чи ви на телефоні, планшеті чи комп’ютері, Hammer якнайкраще використає простір вашого екрана, розширюючись, щоб дати вам місце для роботи. Також підтримує світлий і темний режими.
home_feature_offlinefirst_header=Спершу офлайн
home_feature_offlinefirst_body=Hammer від початку розроблений, щоб бути повністю локальним, без потреби в підключенні до Інтернету. Ви можете синхронізуватися із сервером — власним чи розміщеним третьою стороною, як-от hammer.ink. Але це цілком необов’язково.
home_feature_transparentdata_header=Прозорі дані
home_feature_transparentdata_body=Ваші дані належать вам. Вони не зберігаються в хмарі чи якійсь непрозорій базі даних. Вони зберігаються у простих, зрозумілих людині файлах, де структуру проєкту визначають лише файли та теки. Ви можете відкрити файловий провідник своєї системи й самі поглянути. Якщо ця програма зникне сьогодні, ви зможете легко працювати зі своїми даними.
