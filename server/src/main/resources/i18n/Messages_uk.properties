home_section_writing=Можливості для письма
# Detailed Features
home_detail_scenes_title=Пишіть сценами
home_detail_scenes_body=Розбийте свою історію на менші сцени. Робіть нотатки поруч, пишіть короткий підсумок, щоб бачити свою історію в режимі плану.
home_detail_organize_title=Упорядковуйте свої сцени
home_detail_organize_body=Потрібно, щоб двоє персонажів зустрілися раніше? Просто перетягніть свої сцени, щоб змінити їхній порядок.
home_detail_drafts_title=Використовуйте чернетки своїх сцен
home_detail_drafts_body=Зберігайте чернетку перед значним переписуванням сцени. Це робить великі зміни менш лячними, бо ви завжди можете повернутися назад.
home_detail_timeline_title=Розпишіть свою хронологію
home_detail_timeline_body=Використовуйте функцію хронології, щоб візуалізувати перебіг сюжету чи навіть вашого світу.
home_detail_encyclopedia_title=Пишіть свою енциклопедію
home_detail_encyclopedia_body=Створюйте записи для персонажів, місць, подій — усього, що спаде на думку. Додавайте зображення, щоб передати тисячу слів.
home_detail_notes_title=Нотатки
home_detail_notes_body=Потрібно швидко занотувати думку про свою історію чи світ? Киньте її в розділ нотаток.
