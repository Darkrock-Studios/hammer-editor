home_meta_description=Hammer is an open source tool for writing stories, and the worlds in which they exist.
home_meta_tagline=Own your book, build your world
# Masthead
home_masthead_title_first=Own your book,
home_masthead_title_second=build your world
home_masthead_subtitle=Free and open source. Works offline, on every device you own, and every chapter stays a plain text file on your own disk.
home_hero_download=Download free
home_hero_platforms=Windows, macOS, Linux, Android and iOS. Free and open source.
# Writing features
home_features_eyebrow=Writing in Hammer
home_features_title=Built for the way a novel actually gets written
home_features_lede=Scenes you can move, an encyclopedia that knows who is in them, a timeline, notes, and a record of what you actually wrote.
home_feature_editor_title=An editor that stays out of the way
home_feature_editor_body1=Your scene, the outline you wrote for it, and your notes about it, all on one screen. Word count and metadata sit to the side when you want them and disappear when you don't.
home_feature_editor_body2=Break the book into scenes as small as you like, then drag them into a different order when two characters need to meet earlier.
home_feature_editor_alt=The Hammer editor showing a scene, with the scene list on the left and outline, notes and references on the right
home_feature_encyclopedia_title=An encyclopedia that looks like your world
home_feature_encyclopedia_body1=Characters, places, events and anything else you invent, with pictures. Tag them, search them, keep them a keystroke from the page you are on.
home_feature_encyclopedia_body2=Hammer reads your scenes and works out who is in them. Open a character and it lists every scene they appear in; open a scene and it shows the characters and locations it found, which you confirm or dismiss. Nobody has to remember to tag anything.
home_feature_encyclopedia_body3=Which means you can answer the question every draft eventually raises\: where did she go? Three chapters without your antagonist show up as an absence you can see.
home_feature_encyclopedia_alt=The Hammer encyclopedia showing illustrated entries for characters, places and events
home_feature_timeline_title=See the plot laid out in order
home_feature_timeline_body1=Put the events of your story, or the history of your world, on a dated and tagged timeline, so you can see that the potion comes before the trial, and that three chapters pass without your antagonist.
home_feature_timeline_alt=The Hammer timeline listing dated, tagged story events
home_feature_notes_title=Somewhere to put the thought you just had
home_feature_notes_body1=The observation about your own book that arrives at the wrong moment. Tag it, find it later, keep it next to the manuscript instead of in a file on the desktop called notes2-final.txt.
home_feature_notes_alt=The Hammer notes view with tagged notes about a story
home_feature_activity_title=It counts what you wrote, not what survived
home_feature_activity_body1=Hammer watches each save and counts the words you added, ignoring deletions and rearrangements. Spend a day cutting a chapter to pieces and it still records the writing you did, because you did do it.
home_feature_activity_body2=Daily and weekly goals, today's count, this week against last, your current and longest streak, your best day, and a twelve-week heat map. It also knows your weekday average against your weekend one, which turns out to be more useful than it sounds.
home_feature_activity_body3=Sync, and sessions merge across devices\: the four hundred words you got at a bus stop land in the same total as the ones at your desk. Hammer can even tell you which device you write best on.
home_feature_activity_body4=And the log is a plain text file in your project folder, like everything else. Your writing history is yours to read, or to delete.
home_feature_activity_alt=The Hammer project home showing total words, a weekly goal bar, this week's total against last week, and a writing streak
# After the draft
home_afterdraft_eyebrow=After the draft
home_afterdraft_title=When the book has to leave your desk
home_afterdraft_lede=Writing is only half of it. At some point a draft has to reach an editor, a beta reader, an agent, or a stranger. That is usually where a writing app stops and the copy-paste starts.
home_feature_review_title=Send it to your editor. They don't need an account.
home_feature_review_body1=Choose the scenes, type an email address, and Hammer sends a link. Your editor opens it in a browser and marks your prose up with suggested edits. No download, no signup, no copy of your project handed over.
home_feature_review_body2=You see when they opened it, how many of the scenes they have read, and how many suggestions are waiting for you. Label each request for your own benefit\: my agent, beta read 2. Links expire, and you can revoke one at any point.
home_feature_review_alt=A review request open in a browser, with the editor's suggested edits marked on the manuscript and accept or reject controls beside each one
home_feature_private_title=Show it to three people
home_feature_private_body1=Private links are password protected, can carry an expiry date, and can be revoked whenever you like. Make a separate one per reader if you want to know who is still reading.
home_feature_private_alt=The create private access dialog asking for a password and an optional expiry date, over a story's sharing panel
home_feature_publish_title=Or publish it to everyone
home_feature_publish_body1=A public story page under your pen name, an author page collecting your published work, and a place in the community feed.
home_feature_publish_body2=You can see how many people actually read it, all time and day by day.
home_feature_publish_body3=And it tells you what publishing publicly can cost you before you do it, not after.
home_feature_publish_alt=A published story showing its public sharing link and a readers panel with a total count and a daily chart
home_feature_export_title=Five formats, and it tells you which to pick
home_feature_export_markdown_name=Markdown
home_feature_export_markdown_body=For version control, or moving into another tool.
home_feature_export_epub_name=EPUB
home_feature_export_epub_body=For beta readers on e-readers and phones, where the text has to reflow.
home_feature_export_pdf_name=PDF
home_feature_export_pdf_body=For when the layout must not move.
home_feature_export_word_name=Word
home_feature_export_word_body=For anyone who will leave comments or track changes.
home_feature_export_rtf_name=RTF
home_feature_export_rtf_body=For when you don't know what they use.
home_feature_export_body1=Hammer explains each one at the moment you are choosing, instead of leaving you to guess from a row of file extensions.
home_feature_export_alt=The export dialog with a format picker and an option to treat top-level scenes as chapters
# The three rules
home_rules_eyebrow=The three rules
home_rules_title=Now the part that matters in ten years
home_rules_lede=Everything you just saw is built on three rules. Every one of those features writes to plain files in a folder you own, which is the whole reason to pick this over the alternatives.
home_rule_offline_name=Offline first
home_rule_offline_title=It works with no internet, forever
home_rule_offline_body=Hammer has never required a connection and never will. Write in a cabin, on a plane, in a van parked somewhere with no signal. Sync between your devices if you want it, through a server like this one or one you run yourself, but nothing waits on a server and nothing breaks because a service is down.
home_rule_files_name=Transparent data
home_rule_files_title=Open the folder and it makes sense
home_rule_files_body=Not a database, not a proprietary bundle. Open the project folder with Hammer shut and the shape of your book is already there\: a file per scene, named the way you named it. Search it, back it up, mail it to yourself. Reading your own work should never require this program, or a computer science degree.
home_rule_safety_name=Never lose data
home_rule_safety_title=It is paranoid about losing your work
home_rule_safety_body=Losing your work is the one bug this program is not allowed to have. Sync starts by backing up the whole project. A draft saved before a big rewrite is always there to go back to. Unsaved edits are written to disk as you type, so a crash costs you a sentence at worst. When two devices disagree, Hammer asks which one is right instead of quietly picking.
# Origin story
home_origin_eyebrow=Why it works this way
home_origin_title=I wrote these rules after losing a manuscript
home_origin_body1=I once lived in a van, traveling and writing in often very remote places. I was not working at the time, and was using free writing software that claimed to support offline work. As I came to learn, that claim didn't hold up. After about a week offline, it stopped working. When I got back to civilization, it started working again, but my manuscript was gone.
home_origin_body2=I browsed the app's community forum and saw many other authors asking the same question I was\: Where did my manuscript go?
home_origin_body3=The seeds of the idea for Hammer were born out of this experience. Why was everything a webpage these days? I just wanted to use my own computer that was right in my hands to write and store my stories.
home_origin_caption=Where the three rules came from. September 2020
home_origin_alt=A camper van parked on red dirt at sunset, its back doors open to show a bed and storage bins, a black dog and climbing gear on the ground beside it
home_origin_link=Read the whole story
# Price
home_price_eyebrow=What it costs
home_price_amount=Nothing
home_price_body=Hammer is free and open source under the MIT license. No trial, no card, no account needed to write, and no paid tier of the app. If this server vanished tomorrow, the copy on your machine would carry on working exactly as it does today.
# FAQ
home_faq_title=Reasonable questions
home_faq_account_q=Do I need an account?
home_faq_account_a=No. Download it and write. An account only exists so you can sync between devices, and it is entirely optional.
home_faq_where_q=Where does my writing live?
home_faq_where_a=In a folder you choose on your own device, as plain text files, one per scene, alongside small readable files for your notes and encyclopedia entries.
home_faq_export_q=Can I get my manuscript out?
home_faq_export_a=It was never in. Your scenes are already ordinary files you can open, copy, or hand to anyone, whether or not Hammer is installed. When you want one file instead of a folder, export the whole book as Markdown, EPUB, PDF, Word or RTF.
home_faq_editor_q=Does my editor need to buy anything?
home_faq_editor_a=No, and they don't need an account either. You send a link, they mark up the scenes you chose in their browser, and you get the suggestions back. The link expires and you can revoke it.
home_faq_goesaway_q=What happens if Hammer goes away?
home_faq_goesaway_a=Nothing happens to your book. It is already in a format every text editor on earth can open. The source is MIT licensed, so anyone who wants to keep the app alive can.
home_faq_privacy_q=Is my writing sent anywhere?
home_faq_privacy_a=Only if you switch sync on, and then only to the sync server you chose, whether that is this one or one you run yourself.
home_faq_platforms_q=Which platforms?
home_faq_platforms_a=Windows, macOS, Linux, Android and iOS. The same app and the same files on each, not a website in a box.
# Under the hood
home_hood_eyebrow=Under the hood
home_hood_title=For the technically minded
home_hood_native_header=Native, not a web page
home_hood_native_body=Built in Kotlin with Compose Multiplatform. One codebase, genuinely native clients on five platforms, not a website wrapped in an app shell.
home_hood_screens_header=Fits the screen you have
home_hood_screens_body=Phone, tablet, laptop or a large desktop display\: the layout expands to use the space you have. Light and dark themes throughout.
home_hood_license_header=MIT licensed, self-hostable
home_hood_license_body=Read the source, build it yourself, run your own sync server. No telemetry in the app, and nothing phoning home for a license check.
