home_whatishammer_title=Was ist Hammer?
home_whatishammer_subtitle=Hammer ist ein Open-Source-Tool zum Schreiben von Geschichten und den Welten, in denen sie existieren.
home_feature_multiplatform_header=Plattformübergreifend
home_feature_multiplatform_body=Überall verfügbar – auf deinem Smartphone, Tablet, PC oder Laptop. Es ist nicht einfach nur eine "website-in-a-box". Es werden native Technologien des Endgerätes verwendet, um die bestmögliche Erfahrung zu bieten.
home_feature_multiscreen_header=Bildschirmgröße
home_feature_multiscreen_body=Whether you are on a phone, tablet, or desktop, Hammer will make the best use of your screen space, expanding to give you space to work. Also supporting both light and dark modes.
home_feature_offlinefirst_header=Offline First
home_feature_offlinefirst_body=Hammer is designed from the ground up to be entirely local, no internet connection required, ever. You can sync to a server, either self-hosted or one hosted by a third party such as hammer.ink. But it's entirely optional.
home_feature_transparentdata_header=Datenhoheit
home_feature_transparentdata_body=Your data is yours. It's not stored in the cloud or some opaque database. It is stored in simple, human-readable files, just using files and folders to define the project structure. You can open your system's file browser and take a look for your self. If this program went away today, you would be able to easily interact with your data.
