# Detailed Features
home_detail_scenes_title=In Szenen schreiben
home_detail_scenes_body=Break your story down into smaller scenes. Take notes alongside, write a short summary to help view your story in outline mode.
home_detail_organize_title=Organisiere deine Szenen
home_detail_organize_body=Need two characters to meet earlier? Simply drag and drop your scenes to change their order.
home_detail_drafts_title=Verwende Entwürfe deiner Szenen
home_detail_drafts_body=Save a Draft before a major rewrite of your scene. This makes major changes to your story less scary, because you can always go back.
home_detail_timeline_title=Write out your timeline
home_detail_timeline_body=Use the timeline feature to visualize the timeline of your plot or even your world.
home_detail_encyclopedia_title=Write your Encyclopedia
home_detail_encyclopedia_body=Make entries for your characters, places, events, anything you can think of. Add pictures to capture a thousand words.
home_detail_notes_title=Notizen
home_detail_notes_body=Need to capture a quick thought about your story or world? Throw it into the notes section.
