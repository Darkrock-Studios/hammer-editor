home_feature_multiscreen_body=Egal, ob Sie auf einem Telefon, Tablet oder Computer sind, Hammer wird die beste Nutzung Ihres Bildschirmraums. Auch die Unterst\u00FCtzung von hellen und dunklen Moden.
