home_feature_multiplatform_body=Questa app che porti con te - sul tuo telefono, tablet, desktop o laptop. Può essere installata ed eseguita, e non è semplicemente un sito web racchiuso, ma utilizza tecnologie client side nativo per offrire la migliore esperienza possibile.
home_feature_multiplatform_header=Multi-piattaforma
home_feature_multiscreen_body=Che tu sia su un telefono, un tablet o un desktop, Hammer sfrutterà al meglio il tuo spazio sullo schermo. Supporta anche le modalità chiara e scura.
home_feature_multiscreen_header=Multi-Schermo
home_feature_offlinefirst_body=Che tu sia su un telefono, un tablet o un desktop, Hammer sfrutterà al meglio lo spazio dello schermo. Supporta anche sia la modalità chiara che quella scura.
home_feature_offlinefirst_header=Multi-Schermo
home_feature_transparentdata_body=I tuoi dati sono tuoi. Non sono memorizzati nel cloud o in un database opaco. Sono memorizzati in file semplici e leggibili dall'uomo, utilizzando solo file e cartelle per definire la struttura del progetto. Puoi aprire il browser dei file del tuo sistema operativo e dare un'occhiata di persona. Se questo programma scomparisse oggi, saresti in grado di interagire facilmente con i tuoi dati.
