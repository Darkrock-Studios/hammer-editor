# Detailed Features
home_detail_scenes_title=Scrivi per scene
home_detail_scenes_body=Suddividi la tua storia in scene più piccole. Prendi appunti a fianco, scrivi un breve riassunto per vedere la tua storia in modalità scaletta.
home_detail_organize_title=Organizza le tue scene
home_detail_organize_body=Hai bisogno che due personaggi si incontrino prima? Trascina e rilascia le tue scene per cambiarne l’ordine.
home_detail_drafts_title=Usa le bozze delle tue scene
home_detail_drafts_body=Salva una bozza prima di una riscrittura importante della tua scena. Questo rende i grandi cambiamenti meno spaventosi, perché puoi sempre tornare indietro.
home_detail_timeline_title=Descrivi la tua cronologia
home_detail_timeline_body=Usa la funzione cronologia per visualizzare lo svolgimento della tua trama o persino del tuo mondo.
home_detail_encyclopedia_title=Scrivi la tua enciclopedia
home_detail_encyclopedia_body=Crea voci per i tuoi personaggi, luoghi, eventi, tutto ciò che ti viene in mente. Aggiungi immagini per catturare mille parole.
home_detail_notes_title=Note
home_detail_notes_body=Hai bisogno di annotare un pensiero veloce sulla tua storia o sul tuo mondo? Buttalo nella sezione delle note.
