language=Italiano
page_title=Hammer
home_servermessage=Messaggio del server
home_servermessage_whitelist=Questo server richiede di ottenere un’autorizzazione prima di creare un account. Contatta {0} per entrare nella lista bianca.
home_whatishammer_title=Cos’è Hammer?
home_whatishammer_subtitle=Hammer è uno strumento open source per scrivere storie e i mondi in cui esistono.
home_feature_multiplatform_header=Multipiattaforma
home_feature_multiplatform_body=Porta questa app ovunque\: su telefono, tablet, computer fisso o portatile. Non è semplicemente un sito web in scatola. Usa tecnologie native lato client per offrire la migliore esperienza possibile.
home_feature_multiscreen_header=Multischermo
home_feature_multiscreen_body=Che tu sia su telefono, tablet o computer, Hammer sfrutta al meglio lo spazio del tuo schermo, espandendosi per darti spazio per lavorare. Supporta anche le modalità chiara e scura.
home_feature_offlinefirst_header=Prima offline
home_feature_offlinefirst_body=Hammer è progettato da zero per essere completamente locale, senza mai richiedere una connessione a internet. Puoi sincronizzarti con un server, autogestito o gestito da terzi come hammer.ink. Ma è del tutto facoltativo.
home_feature_transparentdata_header=Dati trasparenti
home_feature_transparentdata_body=I tuoi dati sono tuoi. Non vengono archiviati nel cloud o in qualche database opaco. Vengono salvati in file semplici e leggibili, usando solo file e cartelle per definire la struttura del progetto. Puoi aprire l’esplora file del tuo sistema e dare un’occhiata tu stesso. Se questo programma sparisse oggi, potresti comunque interagire facilmente con i tuoi dati.
home_download_header=Ottieni il tuo Hammer\:
