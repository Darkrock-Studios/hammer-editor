# Detailed Features
home_detail_scenes_title=Escreva em Cenas
home_detail_scenes_body=Divida sua história em cenas menores. Faça anotações ao lado, escreva um breve resumo para ajudar a visualizar sua história no modo de contorno.
home_detail_organize_title=Organize suas cenas
home_detail_organize_body=Quer antecipar o encontro de dois personagens? Simplesmente arraste e solte suas cenas para mudar a ordem delas.
home_detail_drafts_title=Use Rascunhos de suas cenas
home_detail_drafts_body=Salve um Rascunho antes de uma reescrita completa de suas cenas. Isso torna grandes alterações na sua história menos assustadoras, pois você sempre pode desfazê-las.
home_detail_timeline_title=Escreva sua linha do tempo
home_detail_timeline_body=Use o recurso de linha do tempo para visualizar a linha do tempo da sua trama ou até mesmo do seu mundo.
home_detail_encyclopedia_title=Escreva sua Enciclopédia
home_detail_encyclopedia_body=Faça verbetes para seus personagens, lugares, eventos e qualquer coisa que você possa pensar. Adicione fotos para capturar mil palavras.
home_detail_notes_title=Anotações
home_detail_notes_body=Precisa capturar rapidamente uma ideia sobre sua história ou mundo? Jogue na seção de notas.
