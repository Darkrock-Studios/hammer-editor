page_title=Hammer
home_servermessage=Mensagem do Servidor
home_servermessage_whitelist=Este servidor requer que você tenha permissão antes de criar uma conta. Por favor, entre em contato com {0} para entrar na lista de permissões.
home_whatishammer_title=O que é o 'Hammer'?
home_whatishammer_subtitle=O 'Hammer' é uma ferramenta de código aberto para escrever histórias e os mundos nas quais elas existem.
home_feature_multiplatform_header=Multi-plataforma
home_feature_multiplatform_body=Leve este 'app' para qualquer lugar, no seu telefone, 'tablet', 'desktop', ou notebook. Não é simplesmente um site de prateleira. O 'Hammer' usa tecnologias nativas do lado cliente para fornecer a melhor experiência possível.
home_feature_multiscreen_header=Multi-Tela
home_feature_multiscreen_body=Se você está em um celular, "tablet", ou "desktop", o 'Hammer' fará o melhor uso do seu espaço de tela, ampliando para te dar espaço para trabalhar. Também suporta modos claros e escuros.
home_feature_offlinefirst_header=Prioridade ao uso "Offline"
home_feature_offlinefirst_body='Hammer' é projetado do zero para ser totalmente local, nenhuma conexão de 'internet' é necessária. Você pode sincronizar com um servidor, seja ele auto-hospedado ou hospedado por terceiros, como o 'hammer.ink'. Porém, isto é totalmente opcional.
home_feature_transparentdata_header=Dados Transparentes
home_feature_transparentdata_body=Seus dados são seus. Não são armazenados na nuvem nem em algum banco de dados opaco. Eles são armazenados em arquivos simples e legíveis, apenas usando arquivos e pastas para definir a estrutura do projeto. Você pode abrir o navegador de arquivos do seu sistema e procurar por si. Se este programa desaparecesse hoje, você seria capaz de interagir facilmente com seus dados.
