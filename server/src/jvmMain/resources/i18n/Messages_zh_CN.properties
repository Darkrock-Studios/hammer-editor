home.feature.multiplatform.body=这个应用可以随身携带——在你的手机、平板电脑、桌面或笔记本电脑上。它可以安装并运行，并且不仅仅是一个盒子里的网站，而是使用本地客户端技术提供最佳体验。
home.feature.multiplatform.header=多平台
home.feature.multiscreen.body=无论您是在手机、平板电脑还是桌面上，Hammer 都能充分利用您的屏幕空间。同时支持亮色和暗色模式。
home.feature.multiscreen.header=多屏幕
home.feature.offlinefirst.body=无论您是在手机、平板还是桌面上，Hammer 都会充分利用您的屏幕空间。同时支持灯光模式和暗黑模式。
home.feature.offlinefirst.header=多屏幕
home.feature.transparentdata.body=您的数据属于您自己。它并没有存储在云端或某个不透明的数据库中。它存储在简单的人类可读文件中，仅使用文件和文件夹来定义项目结构。您可以打开您的操作系统文件浏览器，自行查看。如果这个程序今天消失，您也能轻松地与您的数据进行互动。
