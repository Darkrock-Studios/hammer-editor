home_whatishammer_title=What is Hammer?
home_whatishammer_subtitle=Hammer is an open source tool for writing stories, and the worlds in which they exist.
home_feature_multiplatform_header=Multi-platform
home_feature_multiplatform_body=This app you bring along \u2014 on your phone, tablet, desktop, or laptop. It can be installed and run, and is not simply a website-in-a-box, but instead uses native client side technologies to provide the best experience possible.
home_feature_multiscreen_header=Multi-Screen
home_feature_multiscreen_body=Whether you are on a phone, tablet, or desktop, Hammer will make the best use of your screen space. Also supporting both light and dark modes.
home_feature_offlinefirst_header=Multi-Screen
home_feature_offlinefirst_body=Whether you are on a phone, tablet, or desktop, Hammer will make the best use of your screen space. Also supporting both light and dark modes.
home_feature_transparentdata_header=Transparent Data
home_feature_transparentdata_body=Your data is yours. It's not stored in the cloud, or some opaque database. It is stored in simple, human readable files, just using files and folders to define the project structure. You can open your OSes file browser and take a look for your self. If this program went away today you would be able to easily interact with your data.
