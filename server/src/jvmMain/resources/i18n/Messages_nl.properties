home.feature.offlinefirst.header=Multi-scherm
home.feature.transparentdata.body=Jouw gegevens zijn van jou. Ze worden niet opgeslagen in de cloud of in een ondoorzichtige database. Ze worden opgeslagen in eenvoudige, door mensen leesbare bestanden, waarbij alleen bestanden en mappen worden gebruikt om de projectstructuur te defini\u00EBren. Je kunt de bestandsbrowser van je OS openen en zelf een kijkje nemen. Als dit programma vandaag zou verdwijnen, zou je gemakkelijk met je gegevens kunnen werken.
