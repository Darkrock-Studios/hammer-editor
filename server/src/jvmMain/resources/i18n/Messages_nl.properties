home.feature.multiplatform.body=Deze app neem je mee - op je telefoon, tablet, desktop of laptop. Het kan worden ge\u00EFnstalleerd en uitgevoerd en is niet simpelweg een website-in-een-doos, maar maakt gebruik van native klant-zijde technologie\u00EBn om de best mogelijke ervaring te bieden.
home.feature.multiplatform.header=Multi-platform
home.feature.multiscreen.body=Ongeacht of je op een telefoon, tablet of desktop zit, Hamer maakt optimaal gebruik van je schermruimte. Ondersteunt ook zowel lichte als donkere modi.
