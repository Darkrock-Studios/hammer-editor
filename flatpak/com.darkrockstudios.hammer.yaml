app-id: com.darkrockstudios.hammer
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

command: hammer

finish-args:
    # Display access
    - --socket=x11
    - --socket=wayland
    - --share=ipc
    - --device=dri
    # File access
    - --filesystem=home
    - --filesystem=xdg-documents
    # Network for sync
    - --share=network

modules:
    -   name: hammer
        buildsystem: simple
        build-options:
            build-args:
                - --share=network
        build-commands:
            # Extract JBR, setup environment, and build with Gradle
            # All in one command block so environment variables persist
            - |
                tar -xzf jbr.tar.gz
                export JAVA_HOME=$PWD/jbrsdk_jcef-21.0.9-linux-x64-b1163.86
                export PATH=$JAVA_HOME/bin:$PATH
                java -version
                chmod +x gradlew
                ./gradlew :desktop:createDistributable -x test --no-daemon
            # Install the app (outputBaseDir is set to 'installers' in build.gradle.kts)
            - mkdir -p /app/lib/hammer
            - cp -r desktop/build/installers/main/app/hammer/* /app/lib/hammer/
            # Create launcher script
            - mkdir -p /app/bin
            - |
                cat > /app/bin/hammer << 'EOF'
                #!/bin/bash
                export JAVA_HOME=/app/jre
                export PATH=$JAVA_HOME/bin:$PATH
                exec /app/lib/hammer/bin/hammer "$@"
                EOF
            - chmod +x /app/bin/hammer
            # Install desktop file and icon
            - install -Dm644 flatpak/com.darkrockstudios.hammer.desktop /app/share/applications/com.darkrockstudios.hammer.desktop
            - install -Dm644 desktop/icons/linux.png /app/share/icons/hicolor/256x256/apps/com.darkrockstudios.hammer.png
            - install -Dm644 flatpak/com.darkrockstudios.hammer.metainfo.xml /app/share/metainfo/com.darkrockstudios.hammer.metainfo.xml
        sources:
            -   type: dir
                path: ..
            -   type: file
                url: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.9-linux-x64-b1163.86.tar.gz
                sha256: 81d780fbea669d67a40a65a678ad0710d224c31439472d2d8933109c95cacf57
                dest-filename: jbr.tar.gz
