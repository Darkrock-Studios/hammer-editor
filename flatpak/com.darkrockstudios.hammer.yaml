app-id: com.darkrockstudios.hammer
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk

command: hammer

finish-args:
    # Display access
    - --socket=x11
    - --socket=wayland
    - --share=ipc
    - --device=dri
    # File access
    - --filesystem=home
    - --filesystem=xdg-documents
    # Network for sync
    - --share=network

modules:
    -   name: hammer
        buildsystem: simple
        build-commands:
            - mkdir -p /app/lib/hammer
            - cp -r hammer/* /app/lib/hammer/
            - mkdir -p /app/bin
            - install -Dm755 hammer.sh /app/bin/hammer
            - install -Dm644 com.darkrockstudios.hammer.desktop /app/share/applications/com.darkrockstudios.hammer.desktop
            - install -Dm644 com.darkrockstudios.hammer.png /app/share/icons/hicolor/256x256/apps/com.darkrockstudios.hammer.png
            - install -Dm644 com.darkrockstudios.hammer.metainfo.xml /app/share/metainfo/com.darkrockstudios.hammer.metainfo.xml
        sources:
            -   type: dir
                path: dist
