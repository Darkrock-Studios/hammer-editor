name: Publish
on:
  release:
    types: [ published ]

jobs:
  publish-fdroid-tag:
    needs: publish-google-play
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create F-Droid tag
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION=${VERSION#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          VERSION_CODE=$(( (PATCH + 1) * 10000 + MINOR * 1000000 + MAJOR * 100000000 ))
          FDROID_TAG="fdroid-${VERSION_CODE}"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch origin release
          git checkout release
          git tag -a "$FDROID_TAG" -m "FDroid release tag for $VERSION"
          git push origin tag "$FDROID_TAG"

  publish-google-play:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_BUILD: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1.307.0
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      - name: Cache Ruby - Bundler
        uses: actions/cache@v5
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Grant Permission to Execute
        run: chmod +x gradlew

      - name: Install bundle
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Restore key
        working-directory: /home/runner/work/hammer-editor/hammer-editor/
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" > release.keystore.asc
          echo ${{ secrets.RELEASE_STORE_PASSWORD_BASE64 }} | base64 -d > passphrase
          gpg -d --passphrase-file passphrase --batch release.keystore.asc > release.keystore

      - name: Create Google Play Config file
        run: |
          echo "$PLAY_CONFIG_JSON" > play_config.json.b64
          base64 -d -i play_config.json.b64 > play_config.json
        env:
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}

      - name: Distribute app to Production track 🚀
        run: bundle exec fastlane release
        env:
          RELEASE_STORE_FILE: /home/runner/work/hammer-editor/hammer-editor/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

  publish-snap:
    needs: publish-google-play
    runs-on: ubuntu-latest
    steps:
      - name: Download Snap from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.event.release.tag_name }} -p 'hammer.snap' -R ${{ github.repository }}

      - name: Upload to Snap Store
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_TOKEN }}
        with:
          snap: hammer.snap
          release: stable

  publish-microsoft-store:
    needs: publish-google-play
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build MSIX package
        run: ./gradlew :desktop:packageMsix

      - name: Upload Gradle problems report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-problems-report
          path: build/reports/problems/problems-report.html
          if-no-files-found: ignore

      - name: Submit to Microsoft Store
        shell: pwsh
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_APP_ID: ${{ secrets.MS_APP_ID }}
        run: |
          $ErrorActionPreference = "Stop"

          # Get access token
          $tokenBody = @{
            grant_type    = "client_credentials"
            client_id     = $env:MS_CLIENT_ID
            client_secret = $env:MS_CLIENT_SECRET
            scope         = "https://manage.devcenter.microsoft.com/.default"
          }
          $tokenResponse = Invoke-RestMethod -Uri "https://login.microsoftonline.com/$env:MS_TENANT_ID/oauth2/v2.0/token" -Method POST -Body $tokenBody
          $accessToken = $tokenResponse.access_token

          $authHeaders = @{
            Authorization  = "Bearer $accessToken"
            "Content-Type" = "application/json"
          }
          $appUrl = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:MS_APP_ID"

          # Only one in-flight submission allowed; clear any stale one.
          $appInfo = Invoke-RestMethod -Uri $appUrl -Method GET -Headers $authHeaders
          if ($appInfo.pendingApplicationSubmission) {
            $pendingId = $appInfo.pendingApplicationSubmission.id
            Write-Host "Deleting stale pending submission $pendingId"
            Invoke-RestMethod -Uri "$appUrl/submissions/$pendingId" -Method DELETE -Headers $authHeaders | Out-Null
          }

          # Create new submission (clones the last published one)
          Write-Host "Creating new submission..."
          $submission = Invoke-RestMethod -Uri "$appUrl/submissions" -Method POST -Headers $authHeaders
          $submissionId    = $submission.id
          $fileUploadUrl   = $submission.fileUploadUrl
          Write-Host "Submission ID: $submissionId"

          # Find MSIX file
          $msixFile = Get-ChildItem -Path "desktop\build\installers\Hammer-*.msix" | Select-Object -First 1
          if (-not $msixFile) {
            throw "No MSIX file found in desktop\build\installers\"
          }
          $msixName = $msixFile.Name
          Write-Host "MSIX: $($msixFile.FullName)"

          # Without PendingDelete + a new PendingUpload entry the commit
          # succeeds against the cloned package list and the Store keeps the old version.
          $existing = @($submission.applicationPackages)
          foreach ($pkg in $existing) {
            $pkg.fileStatus = "PendingDelete"
          }
          $newPackage = [PSCustomObject]@{
            fileName   = $msixName
            fileStatus = "PendingUpload"
          }
          $submission.applicationPackages = @($existing + $newPackage)

          # PUT the modified submission back
          Write-Host "Updating submission with new package metadata..."
          $submissionJson = $submission | ConvertTo-Json -Depth 50
          Invoke-RestMethod -Uri "$appUrl/submissions/$submissionId" -Method PUT -Headers $authHeaders -Body $submissionJson | Out-Null

          # fileUploadUrl expects a ZIP whose entries match the applicationPackages fileNames, not a raw MSIX.
          $zipPath = Join-Path $msixFile.DirectoryName "submission.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path $msixFile.FullName -DestinationPath $zipPath

          Write-Host "Uploading $zipPath to blob storage..."
          $zipBytes = [System.IO.File]::ReadAllBytes($zipPath)
          $blobHeaders = @{ "x-ms-blob-type" = "BlockBlob" }
          Invoke-RestMethod -Uri $fileUploadUrl -Method PUT -Headers $blobHeaders -Body $zipBytes -ContentType "application/octet-stream" | Out-Null
          Write-Host "Upload complete."

          # Commit submission
          Write-Host "Committing submission..."
          Invoke-RestMethod -Uri "$appUrl/submissions/$submissionId/commit" -Method POST -Headers $authHeaders | Out-Null

          # CommitFailed only surfaces via /status, not the commit response.
          Write-Host "Polling submission status..."
          $deadline = (Get-Date).AddMinutes(15)
          while ($true) {
            Start-Sleep -Seconds 20
            $status = Invoke-RestMethod -Uri "$appUrl/submissions/$submissionId/status" -Method GET -Headers $authHeaders
            Write-Host "  status=$($status.status)"
            if ($status.status -eq "CommitStarted" -or $status.status -eq "PreProcessing") {
              if ((Get-Date) -gt $deadline) {
                Write-Host "Still processing after 15 minutes — leaving it to the Store. Check Partner Center."
                break
              }
              continue
            }
            if ($status.status -eq "PendingCommit" -or $status.status -eq "CommitFailed") {
              $details = $status.statusDetails | ConvertTo-Json -Depth 10
              throw "Submission commit failed (status=$($status.status)). Details: $details"
            }
            # Any other status (Release, Published, Certification) = commit succeeded; rest is the Store's problem.
            break
          }

          Write-Host "Submission committed successfully."

  publish-mac-app-store:
    runs-on: macos-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1.307.0
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      - name: Grant Permission to Execute
        run: chmod +x gradlew desktop/scripts/build-appstore.sh

      - name: Install bundle
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Set up signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MAC_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"' | xargs)

      - name: Place provisioning profiles
        env:
          EMBEDDED_PROFILE_B64: ${{ secrets.MAC_EMBEDDED_PROVISIONING_PROFILE_BASE64 }}
          RUNTIME_PROFILE_B64: ${{ secrets.MAC_RUNTIME_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo -n "$EMBEDDED_PROFILE_B64" | base64 --decode -o desktop/embedded.provisionprofile
          echo -n "$RUNTIME_PROFILE_B64" | base64 --decode -o desktop/runtime.provisionprofile

      - name: Place App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.MAC_APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p desktop/secrets
          printf '%s' "$API_KEY_P8" > desktop/secrets/AuthKey_F8BSZ7LC8Q.p8

      - name: Upload to TestFlight 🍎
        run: bundle exec fastlane mac desktop_testflight

      - name: Upload Gradle problems report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-problems-report-macos
          path: build/reports/problems/problems-report.html
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f desktop/embedded.provisionprofile desktop/runtime.provisionprofile
          rm -rf desktop/secrets

  publish-ios-app-store:
    runs-on: macos-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1.307.0
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      - name: Install bundle
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Set up signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/ios-cert.p12"
          security import "$RUNNER_TEMP/ios-cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"' | xargs)

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_TMP="$RUNNER_TEMP/Hammer.mobileprovision"
          echo -n "$PROFILE_B64" | base64 --decode -o "$PROFILE_TMP"
          UUID=$(security cms -D -i "$PROFILE_TMP" | plutil -extract UUID raw -)

          # Xcode 16 reads profiles from Developer/Xcode/UserData/...; older Xcode
          # and Fastlane gym look at MobileDevice/... — install to both for safety.
          NEW_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          LEGACY_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$NEW_DIR" "$LEGACY_DIR"
          cp "$PROFILE_TMP" "$NEW_DIR/$UUID.mobileprovision"
          cp "$PROFILE_TMP" "$LEGACY_DIR/$UUID.mobileprovision"

      - name: Place App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.MAC_APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p desktop/secrets
          printf '%s' "$API_KEY_P8" > desktop/secrets/AuthKey_F8BSZ7LC8Q.p8

      - name: Upload to TestFlight 📱
        run: bundle exec fastlane ios ios_testflight

      - name: Upload Fastlane logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fastlane-ios-logs
          path: |
            ~/Library/Logs/gym/
            fastlane/report.xml
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          rm -rf desktop/secrets ios/build

  notify:
    needs: [ publish-fdroid-tag, publish-google-play, publish-snap, publish-microsoft-store, publish-mac-app-store, publish-ios-app-store ]
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554 # 0.4.0
        with:
          args: "**New release:** {{ EVENT_PAYLOAD.release.name }}\n**Download Here:** {{ EVENT_PAYLOAD.release.html_url }}\n\n**Changelog:**\n{{ EVENT_PAYLOAD.release.body }}"