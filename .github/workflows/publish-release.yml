name: Publish
on:
  release:
    types: [ published ]

# Tag-suffix gating: every per-store job runs when the release tag has no `+`
# suffix (full release) OR when the tag contains that store's platform token
# (single-store / subset release). All store jobs are independent and run in
# parallel. See buildSrc Platform enum for the token catalog.
jobs:
  publish-google-play:
    if: ${{ !contains(github.event.release.tag_name, '+') || contains(github.event.release.tag_name, '+google-play') }}
    uses: ./.github/workflows/publish-google-play.yml
    secrets: inherit
    with:
      track: production

  publish-fdroid-tag:
    if: ${{ !contains(github.event.release.tag_name, '+') || contains(github.event.release.tag_name, '+fdroid') }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-fdroid-tag.yml
    secrets: inherit
    with:
      release_tag: ${{ github.event.release.tag_name }}

  publish-snap:
    if: ${{ !contains(github.event.release.tag_name, '+') || contains(github.event.release.tag_name, '+snap') }}
    uses: ./.github/workflows/publish-snap.yml
    secrets: inherit
    with:
      release_tag: ${{ github.event.release.tag_name }}

  publish-microsoft-store:
    if: ${{ !contains(github.event.release.tag_name, '+') || contains(github.event.release.tag_name, '+ms-store') }}
    uses: ./.github/workflows/publish-microsoft-store.yml
    secrets: inherit

  publish-mac-app-store:
    if: ${{ !contains(github.event.release.tag_name, '+') || contains(github.event.release.tag_name, '+mac-app-store') }}
    uses: ./.github/workflows/publish-mac-app-store.yml
    secrets: inherit

  publish-ios-app-store:
    if: ${{ !contains(github.event.release.tag_name, '+') || contains(github.event.release.tag_name, '+ios-app-store') }}
    uses: ./.github/workflows/publish-ios-app-store.yml
    secrets: inherit

  notify:
    needs: [ publish-fdroid-tag, publish-google-play, publish-snap, publish-microsoft-store, publish-mac-app-store, publish-ios-app-store ]
    # Fire when all upstream jobs either succeeded or were intentionally skipped
    # by the platform filter — but not when something actually failed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Discord notification
        # Message is built by the shared script so its token catalog, format,
        # and length handling stay identical to the manual announcer
        # (announce-release.yml). Untrusted release fields are passed via env,
        # never interpolated into the run script.
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          content="$(bash .github/scripts/discord-release-message.sh)"
          jq -n --arg content "$content" '{content: $content}' \
            | curl -fsSL -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
