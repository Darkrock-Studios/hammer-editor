name: Publish Docker Image

# Builds the server distribution and publishes a multi-arch (linux/amd64 +
# linux/arm64) image to GitHub Container Registry.
#
# The distribution is built on GitHub's ubuntu-latest runner because the :server
# module depends on :base, which needs the preinstalled Android SDK. The image
# itself only packages that distribution (see docker/Dockerfile).
#
# FIRST RUN: the GHCR package is created automatically — nothing to register up
# front. It may however be created *private*, which would break the anonymous
# `docker pull` the docs tell self-hosters to use. After the first successful
# publish, check the package page and, if needed, set Package settings ->
# Danger Zone -> Change visibility -> Public. That is a one-way door: a public
# package cannot be made private again, which is why it is left as a deliberate
# manual step rather than automated here.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 3.7.1). Defaults to 'manual'."
        required: false
        default: "manual"

# Required, not boilerplate: this repo's default workflow token is read-only, so
# without this block the push to GHCR fails with a 403.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/server

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build server distribution
        run: ./gradlew :server:installDist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # For releases: tag with the version and 'latest'. For manual runs: use
          # the provided input tag. sha tags are always added for traceability.
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
