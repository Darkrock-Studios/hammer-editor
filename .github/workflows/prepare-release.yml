name: Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gradle caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package Windows distributions
        run: >
          ./gradlew
          :desktop:packageReleaseMsi
          :desktop:packageReleaseExe
          :desktop:packageReleasePortable
          :desktop:packageReleaseAppX

      - name: Stage Windows artifacts
        shell: pwsh
        # Nucleus splits store formats (AppX) into a sandboxed pipeline whose
        # output path uses a `-sandboxed` suffix somewhere — exact location
        # not pinned down in docs. Search the whole binaries tree by
        # extension to be robust to either layout.
        run: |
          $stage = "$env:GITHUB_WORKSPACE\release-artifacts"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $root = "desktop\build\compose\binaries"
          function Find-And-Copy([string]$pattern, [string[]]$excludePatterns, [string]$dest) {
            $hit = Get-ChildItem -Path $root -Filter $pattern -Recurse -File |
              Where-Object {
                $path = $_.FullName
                -not ($excludePatterns | Where-Object { $path -like "*$_*" })
              } |
              Select-Object -First 1
            if (-not $hit) { throw "No file matching $pattern under $root" }
            Copy-Item $hit.FullName -Destination $dest
          }
          # Find one MSI; one EXE that's NOT the portable; the portable EXE;
          # and the AppX/MSIX.
          Find-And-Copy "*.msi" @() "$stage\hammer.msi"
          $allExes = Get-ChildItem -Path $root -Filter *.exe -Recurse -File
          $installerExe = $allExes | Where-Object { $_.FullName -notlike "*portable*" } | Select-Object -First 1
          $portableExe  = $allExes | Where-Object { $_.FullName -like     "*portable*" } | Select-Object -First 1
          if (-not $installerExe) { throw "No NSIS exe found" }
          if (-not $portableExe)  { throw "No portable exe found" }
          Copy-Item $installerExe.FullName -Destination "$stage\hammer.exe"
          Copy-Item $portableExe.FullName  -Destination "$stage\hammer-portable.exe"
          $appx = Get-ChildItem -Path $root -Include *.appx,*.msix -Recurse -File | Select-Object -First 1
          if (-not $appx) { throw "No AppX/MSIX found" }
          Copy-Item $appx.FullName -Destination "$stage\hammer.appx"
          Get-ChildItem $stage

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}\\release-artifacts\\hammer.msi,${{ github.workspace }}\\release-artifacts\\hammer.exe,${{ github.workspace }}\\release-artifacts\\hammer-portable.exe,${{ github.workspace }}\\release-artifacts\\hammer.appx"

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JBR
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot snapd flatpak flatpak-builder libfuse2
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08
          flatpak install --user -y flathub org.freedesktop.Sdk//24.08

      - name: Gradle caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package Linux distributions
        run: >
          ./gradlew
          :desktop:packageReleaseDeb
          :desktop:packageReleaseRpm
          :desktop:packageReleaseAppImage
          :desktop:packageReleaseSnap
          :desktop:packageReleaseFlatpak

      - name: Stage Linux artifacts
        # Nucleus splits store formats (Flatpak) into a sandboxed pipeline
        # whose output path uses a `-sandboxed` suffix; search the whole
        # binaries tree by extension to be robust to either layout.
        run: |
          STAGE="$GITHUB_WORKSPACE/release-artifacts"
          mkdir -p "$STAGE"
          ROOT="desktop/build/compose/binaries"
          first() { find "$ROOT" -type f -name "$1" | head -1; }
          require() {
            local found=$1 name=$2
            if [ -z "$found" ] || [ ! -f "$found" ]; then
              echo "No file matching $name found under $ROOT" >&2; exit 1
            fi
          }
          for pair in "*.deb|hammer.deb" "*.rpm|hammer.rpm" "*.AppImage|hammer.AppImage" "*.snap|hammer.snap" "*.flatpak|hammer.flatpak"; do
            glob=${pair%|*}; out=${pair#*|}
            src=$(first "$glob"); require "$src" "$glob"
            cp "$src" "$STAGE/$out"
          done
          ls -la "$STAGE"

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/release-artifacts/hammer.deb,${{ github.workspace }}/release-artifacts/hammer.rpm,${{ github.workspace }}/release-artifacts/hammer.AppImage,${{ github.workspace }}/release-artifacts/hammer.snap,${{ github.workspace }}/release-artifacts/hammer.flatpak"

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gradle caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package macOS distributions
        run: >
          ./gradlew
          :desktop:packageReleaseDmg
          :desktop:packageReleasePkg

      - name: Stage macOS artifacts
        # PKG runs through Nucleus's sandboxed pipeline (Mac App Store target);
        # output path uses a `-sandboxed` suffix. Search the whole binaries
        # tree by extension to be robust to either layout.
        run: |
          STAGE="$GITHUB_WORKSPACE/release-artifacts"
          mkdir -p "$STAGE"
          ROOT="desktop/build/compose/binaries"
          DMG=$(find "$ROOT" -type f -name '*.dmg' | head -1)
          PKG=$(find "$ROOT" -type f -name '*.pkg' | head -1)
          [ -f "$DMG" ] || { echo "No .dmg found"; exit 1; }
          [ -f "$PKG" ] || { echo "No .pkg found"; exit 1; }
          cp "$DMG" "$STAGE/hammer.dmg"
          cp "$PKG" "$STAGE/hammer.pkg"
          ls -la "$STAGE"

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/release-artifacts/hammer.dmg,${{ github.workspace }}/release-artifacts/hammer.pkg"

  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21

      - name: Gradle caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package Server distributions
        run: ./gradlew :server:assembleDist

      - name: Rename tar Artifact
        run: |
          file=$(find . -type f -name 'server-*.tar' -print -quit)
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi
          mv "$file" "${file/server-*/server}.tar"
          echo "File renamed successfully."
      - name: Rename zip Artifact
        run: |
          file=$(find . -type f -name 'server-*.zip' -print -quit)
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi
          mv "$file" "${file/server-*/server}.zip"
          echo "File renamed successfully."

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/server/build/distributions/*.*"

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21

      - name: Gradle caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore key
        working-directory: ${{ github.workspace }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" > release.keystore.asc
          echo ${{ secrets.RELEASE_STORE_PASSWORD_BASE64 }} | base64 -d > passphrase
          gpg -d --passphrase-file passphrase --batch release.keystore.asc > release.keystore

      - name: Build APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :android:assembleRelease

      - name: Rename APK Artifact
        run: |
          cd $GITHUB_WORKSPACE/android/build/outputs/apk/release/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name '*.apk' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no APK file found."
            exit 1
          fi

          # rename the file to "hammer.apk"
          mv "$file" "hammer.apk"

          echo "File renamed successfully."

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/android/build/outputs/apk/release/hammer.apk"

  snap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JBR
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: 21
          cache: gradle

      - name: Grant Permission to Execute
        run: chmod +x gradlew

      - name: Build Snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build-snap

      - name: Rename Snap Artifact
        run: |
          mv "${{ steps.build-snap.outputs.snap }}" hammer.snap
          echo "File renamed successfully."

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: hammer.snap

  flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JBR
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: 21
          cache: gradle

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak SDK and runtime
        uses: actions/cache@v5
        with:
          path: ~/.local/share/flatpak
          key: flatpak-sdk-runtime-24.08

      - name: Install Flatpak SDK and runtime
        run: |
          flatpak install --user -y flathub org.freedesktop.Platform//24.08
          flatpak install --user -y flathub org.freedesktop.Sdk//24.08

      - name: Grant Permission to Execute
        run: chmod +x gradlew

      - name: Build Flatpak
        run: ./gradlew buildDistFlatpak

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/desktop/build/installers/main-release/flatpak/hammer.flatpak"

  set-release-body:
    runs-on: ubuntu-latest
    needs: [ windows, linux, macos, android, server ]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch tags
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Get last tag message
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          TAG_MESSAGE=$(git tag -n90 --format='%(contents)' "$TAG_NAME" )

          echo "Tag: $TAG_NAME"
          echo -e "Tag message:\n$TAG_MESSAGE"

          echo "tag_message<<EOF" >> $GITHUB_ENV
          echo "$TAG_MESSAGE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set release body
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          allowUpdates: true
          body: ${{ env.tag_message }}
