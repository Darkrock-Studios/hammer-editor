name: Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Run Unit Tests
        run: ./gradlew koverXmlReport

      - name: Run Server Unit Tests
        run: ./gradlew :server:test

      - name: Run Server Migration Tests
        run: ./gradlew :server:verifySqlDelightMigration

      - name: Run Round-Trip Sync Integration Tests
        id: integration-tests
        run: ./gradlew :integrationTests:jvmTest

      - name: Upload integration test report on failure
        if: failure() && steps.integration-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: integration-tests-report
          path: |
            integrationTests/build/reports/tests/jvmTest/
            integrationTests/build/test-results/jvmTest/

  windows:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle caching
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package Windows ".msi" distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          shell: pwsh
          command: ./gradlew :desktop:packageReleaseMsi -Pchannel=github -Pformat=msi

      - name: Rename MSI Artifact
        shell: cmd
        run: |
          setlocal enabledelayedexpansion

          set "pattern=hammer-*.msi"
          set "newName=hammer.msi"
          set "foundFile="

          for /r %%i in (%pattern%) do (
            set "foundFile=%%i"
          )

          if defined foundFile (
          echo Renaming !foundFile! to %newName%
            ren "!foundFile!" "%newName%"
          ) else (
            echo No file matching pattern found.
          )

          endlocal

          echo Successfully renamed file to "hammer.msi"

      - name: Package Windows ".exe" distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          shell: pwsh
          command: ./gradlew :desktop:packageReleaseExe -Pchannel=github -Pformat=exe

      - name: Rename EXE Artifact
        shell: cmd
        run: |
          setlocal enabledelayedexpansion

          set "pattern=hammer-*.exe"
          set "newName=hammer.exe"
          set "foundFile="

          for /r %%i in (%pattern%) do (
            set "foundFile=%%i"
          )

          if defined foundFile (
          echo Renaming !foundFile! to %newName%
            ren "!foundFile!" "%newName%"
          ) else (
            echo No file matching pattern found.
          )

          endlocal

          echo Successfully renamed file to "hammer.exe"

      - name: Write update digests
        shell: pwsh
        run: ./gradlew writeAssetDigests "-PassetFiles=desktop/build/installers/main-release/msi/hammer.msi,desktop/build/installers/main-release/exe/hammer.exe"

      - name: Upload update digests
        uses: actions/upload-artifact@v7
        with:
          name: update-digests-windows
          path: desktop/build/installers/main-release/*/hammer.*.sha512
          if-no-files-found: error

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}\\desktop\\build\\installers\\main-release\\msi\\hammer.msi,${{ github.workspace }}\\desktop\\build\\installers\\main-release\\exe\\hammer.exe"

  linux:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle caching
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # appimagetool and the AppImage runtime are pinned in linuxDistributions.kt;
      # cache them so buildDistAppImage doesn't re-download them every release.
      - name: Cache appimagetool
        uses: actions/cache@v6
        with:
          path: |
            appimagetool-x86_64.AppImage
            appimage-runtime-x86_64
          key: appimagetool-1.9.1-runtime-20251108

      # buildDistAppImage generates the .zsync delta file with the system zsyncmake;
      # appimagetool's bundled copy is broken, so install the system zsync package.
      - name: Install zsync
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            sudo apt-get update
            sudo apt-get install -y zsync

      - name: Package Linux ".deb" distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ./gradlew :desktop:packageReleaseDeb -Pchannel=github -Pformat=deb

      - name: Rename DEB Artifact
        run: |
          cd $GITHUB_WORKSPACE/desktop/build/installers/main-release/deb/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name 'hammer_*.deb' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi

          # rename the file to "hammer.deb"
          mv "$file" "${file/hammer_*/hammer}.deb"

          echo "File renamed successfully."

      - name: Make DEB installable on Debian
        run: .github/scripts/deb-make-portable.sh desktop/build/installers/main-release/deb/hammer.deb

      - name: Smoke test the ".deb" CLI on Debian
        run: .github/scripts/deb-debian-smoke-test.sh desktop/build/installers/main-release/deb/hammer.deb android/src/main/res/mipmap-mdpi/ic_launcher.webp

      - name: Package Linux ".rpm" distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ./gradlew :desktop:packageReleaseRpm -Pchannel=github -Pformat=rpm

      - name: Rename RPM Artifact
        run: |
          cd $GITHUB_WORKSPACE/desktop/build/installers/main-release/rpm/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name 'hammer-*.rpm' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi

          # rename the file to "hammer.rpm"
          mv "$file" "hammer.rpm"

          echo "File renamed successfully."

      - name: Build Linux ".appimage" distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ./gradlew buildDistAppImage -Pchannel=appimage -Pformat=appimage

      - name: Build Linux ".tar.gz" distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ./gradlew buildDistTarball -Pchannel=github -Pformat=tarball

      - name: Smoke test the ".tar.gz" CLI without a display
        run: |
          unpacked="$RUNNER_TEMP/hammer-tarball"
          mkdir -p "$unpacked"
          tar -xzf desktop/build/installers/main-release/tarball/hammer-x64.tar.gz -C "$unpacked"
          .github/scripts/cli-smoke-test.sh "$unpacked/hammer/bin/hammer" android/src/main/res/mipmap-mdpi/ic_launcher.webp

      - name: Write update digests
        run: ./gradlew writeAssetDigests "-PassetFiles=desktop/build/installers/main-release/deb/hammer.deb,desktop/build/installers/main-release/rpm/hammer.rpm,desktop/build/installers/main-release/appimage/hammer.AppImage,desktop/build/installers/main-release/tarball/hammer-x64.tar.gz"

      - name: Upload update digests
        uses: actions/upload-artifact@v7
        with:
          name: update-digests-linux
          path: desktop/build/installers/main-release/*/hammer*.sha512
          if-no-files-found: error

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/desktop/build/installers/main-release/deb/hammer.deb,${{ github.workspace }}/desktop/build/installers/main-release/rpm/hammer.rpm,${{ github.workspace }}/desktop/build/installers/main-release/appimage/hammer.AppImage,${{ github.workspace }}/desktop/build/installers/main-release/appimage/hammer.AppImage.zsync,${{ github.workspace }}/desktop/build/installers/main-release/tarball/hammer-x64.tar.gz"

  # Raspberry Pi and other aarch64 boards. jpackage and the bundled JRE and Skiko all follow the
  # build machine, so this needs a native arm64 runner rather than a cross build.
  linux-arm64:
    needs: tests
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle caching
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      # jpackage's .deb step shells out to fakeroot, and the smoke tests use jq and unzip; the arm64
      # runner image may not carry them.
      - name: Install packaging and smoke test tools
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            sudo apt-get update
            sudo apt-get install -y fakeroot jq unzip

      - name: Package Linux arm64 ".deb" distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ./gradlew :desktop:packageReleaseDeb -Pchannel=github -Pformat=deb

      - name: Rename DEB Artifact
        run: |
          cd $GITHUB_WORKSPACE/desktop/build/installers/main-release/deb/
          file=$(find . -type f -name 'hammer_*_arm64.deb' -print -quit)
          if [ -z "$file" ]; then
            echo "Error: no hammer_*_arm64.deb found."
            exit 1
          fi
          mv "$file" "hammer-arm64.deb"

      # Raspberry Pi OS is Debian, often without a desktop; see the script for what jpackage gets wrong there.
      - name: Make DEB installable on Debian
        run: .github/scripts/deb-make-portable.sh desktop/build/installers/main-release/deb/hammer-arm64.deb

      # A Pi used as a writing device may have no display server at all; the CLI must still run.
      - name: Smoke test the ".deb" CLI without a display
        run: |
          sudo apt-get install -y ./desktop/build/installers/main-release/deb/hammer-arm64.deb
          .github/scripts/cli-smoke-test.sh /opt/hammer/bin/hammer android/src/main/res/mipmap-mdpi/ic_launcher.webp

      - name: Smoke test the ".deb" CLI on Debian
        run: .github/scripts/deb-debian-smoke-test.sh desktop/build/installers/main-release/deb/hammer-arm64.deb android/src/main/res/mipmap-mdpi/ic_launcher.webp

      - name: Build Linux arm64 ".tar.gz" distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ./gradlew buildDistTarball -Pchannel=github -Pformat=tarball

      - name: Smoke test the ".tar.gz" CLI without a display
        run: |
          unpacked="$RUNNER_TEMP/hammer-tarball"
          mkdir -p "$unpacked"
          tar -xzf desktop/build/installers/main-release/tarball/hammer-arm64.tar.gz -C "$unpacked"
          .github/scripts/cli-smoke-test.sh "$unpacked/hammer/bin/hammer" android/src/main/res/mipmap-mdpi/ic_launcher.webp

      - name: Write update digests
        run: ./gradlew writeAssetDigests "-PassetFiles=desktop/build/installers/main-release/deb/hammer-arm64.deb,desktop/build/installers/main-release/tarball/hammer-arm64.tar.gz"

      - name: Upload update digests
        uses: actions/upload-artifact@v7
        with:
          name: update-digests-linux-arm64
          path: desktop/build/installers/main-release/*/hammer-arm64.*.sha512
          if-no-files-found: error

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/desktop/build/installers/main-release/deb/hammer-arm64.deb,${{ github.workspace }}/desktop/build/installers/main-release/tarball/hammer-arm64.tar.gz"

  macos:
    needs: tests
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle caching
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package MacOS ".dmg" distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ./gradlew :desktop:packageReleaseDmg -Pchannel=github -Pformat=dmg

      - name: Rename DMG Artifact
        run: |
          cd $GITHUB_WORKSPACE/desktop/build/installers/main-release/dmg/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name 'hammer-*.dmg' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi

          # rename the file to "hammer.dmg"
          mv "$file" "${file/hammer-*/hammer}.dmg"

          echo "File renamed successfully."

      - name: Package MacOS ".pkg" distribution
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ./gradlew :desktop:packageReleasePkg -Pchannel=github -Pformat=pkg

      - name: Rename PKG Artifact
        run: |
          cd $GITHUB_WORKSPACE/desktop/build/installers/main-release/pkg/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name 'hammer-*.pkg' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi

          # rename the file to "hammer.pkg"
          mv "$file" "hammer.pkg"

          echo "File renamed successfully."
          echo "Contents of pkg directory:"
          ls -la

      - name: Write update digests
        run: ./gradlew writeAssetDigests "-PassetFiles=desktop/build/installers/main-release/dmg/hammer.dmg,desktop/build/installers/main-release/pkg/hammer.pkg"

      - name: Upload update digests
        uses: actions/upload-artifact@v7
        with:
          name: update-digests-macos
          path: desktop/build/installers/main-release/*/hammer.*.sha512
          if-no-files-found: error

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/desktop/build/installers/main-release/dmg/hammer.dmg,${{ github.workspace }}/desktop/build/installers/main-release/pkg/hammer.pkg"

  server:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle caching
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package Server distributions
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ./gradlew :server:assembleDist

      - name: Rename tar Artifact
        run: |
          file=$(find . -type f -name 'server-*.tar' -print -quit)
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi
          mv "$file" "${file/server-*/server}.tar"
          echo "File renamed successfully."
      - name: Rename zip Artifact
        run: |
          file=$(find . -type f -name 'server-*.zip' -print -quit)
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi
          mv "$file" "${file/server-*/server}.zip"
          echo "File renamed successfully."

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/server/build/distributions/*.*"

  android:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle caching
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore key
        working-directory: ${{ github.workspace }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" > release.keystore.asc
          echo ${{ secrets.RELEASE_STORE_PASSWORD_BASE64 }} | base64 -d > passphrase
          gpg -d --passphrase-file passphrase --batch release.keystore.asc > release.keystore

      - name: Build APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          # Build the F-Droid flavor for the GitHub release APK: it enables the
          # public-storage projects feature (adds the storage permissions). The
          # Google Play build is produced separately via publish-google-play.yml.
          command: ./gradlew :android:assembleRelease -Pfdroid=true

      - name: Rename APK Artifact
        run: |
          cd $GITHUB_WORKSPACE/android/build/outputs/apk/release/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name '*.apk' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no APK file found."
            exit 1
          fi

          # rename the file to "hammer.apk"
          mv "$file" "hammer.apk"

          echo "File renamed successfully."

      - name: Rename R8 Mapping
        run: cp "$GITHUB_WORKSPACE/android/build/outputs/mapping/release/mapping.txt" "$GITHUB_WORKSPACE/android/build/outputs/apk/release/hammer-apk-mapping.txt"

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/android/build/outputs/apk/release/hammer.apk,${{ github.workspace }}/android/build/outputs/apk/release/hammer-apk-mapping.txt"

  snap:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Grant Permission to Execute
        run: chmod +x gradlew

      - name: Build Snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build-snap

      - name: Rename Snap Artifact
        run: |
          mv "${{ steps.build-snap.outputs.snap }}" hammer.snap
          echo "File renamed successfully."

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: hammer.snap

  flatpak:
    needs: tests
    # flatpak-builder builds for the arch it runs on, so each bundle needs its own runner.
    strategy:
      # The arm64 leg failing should not cancel the x64 one.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            bundle: hammer.flatpak
          - runner: ubuntu-24.04-arm
            bundle: hammer-arm64.flatpak
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Install Flatpak and flatpak-builder
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            sudo apt-get update
            sudo apt-get install -y flatpak flatpak-builder
            flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak SDK and runtime
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-sdk-runtime-24.08-${{ runner.arch }}

      - name: Install Flatpak SDK and runtime
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: |
            flatpak install --user -y flathub org.freedesktop.Platform//24.08
            flatpak install --user -y flathub org.freedesktop.Sdk//24.08

      - name: Grant Permission to Execute
        run: chmod +x gradlew

      - name: Build Flatpak
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: ./gradlew buildDistFlatpak -Pchannel=flathub -Pformat=flatpak

      - name: Name bundle for arch
        if: matrix.bundle != 'hammer.flatpak'
        run: mv desktop/build/installers/main-release/flatpak/hammer.flatpak "desktop/build/installers/main-release/flatpak/${{ matrix.bundle }}"

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/desktop/build/installers/main-release/flatpak/${{ matrix.bundle }}"

  set-release-body:
    runs-on: ubuntu-latest
    needs: [ windows, linux, linux-arm64, macos, android, server, snap, flatpak ]
    if: success()
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fetch tags
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle caching
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # The desktop updater reads latest*.yml from the release. Each platform job hashed
      # the installer it attached and handed the digest over as a workflow artifact, so
      # nothing is downloaded back and no release lookup is needed. Attached before the
      # draft flips, so a published release never exists without them.
      - name: Collect update digests
        uses: actions/download-artifact@v7
        with:
          pattern: update-digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/update-digests

      - name: Write update metadata
        run: ./gradlew writeUpdateMetadata "-PreleaseDigestsDir=${{ runner.temp }}/update-digests" --no-daemon

      - name: Attach update metadata
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/build/update-metadata/latest.yml,${{ github.workspace }}/build/update-metadata/latest-mac.yml,${{ github.workspace }}/build/update-metadata/latest-linux.yml,${{ github.workspace }}/build/update-metadata/latest-linux-arm64.yml"

      - name: Get last tag message
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          TAG_MESSAGE=$(git tag -n90 --format='%(contents)' "$TAG_NAME" )

          # prepareForRelease appends this trailer when the release dialog's
          # auto-publish box is checked. Strip it so it stays out of the body.
          AUTO_PUBLISH=false
          if printf '%s\n' "$TAG_MESSAGE" | grep -qxF 'Auto-Publish: true'; then
            AUTO_PUBLISH=true
          fi
          TAG_MESSAGE=$(printf '%s\n' "$TAG_MESSAGE" | grep -vxF 'Auto-Publish: true' || true)
          echo "auto_publish=$AUTO_PUBLISH" >> $GITHUB_ENV
          echo "Auto-publish: $AUTO_PUBLISH"
          
          echo "Tag: $TAG_NAME"
          echo -e "Tag message:\n$TAG_MESSAGE"
          
          echo "tag_message<<EOF" >> $GITHUB_ENV
          echo "$TAG_MESSAGE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set release body
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          allowUpdates: true
          body: ${{ env.tag_message }}

      # Flipping the draft fires `release: published`, which starts
      # publish-release.yml. The token must not be GITHUB_TOKEN: GitHub suppresses
      # workflow runs triggered by it, so no store would ever publish.
      - name: Publish release
        if: env.auto_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Auto-publish was requested but the RELEASE_PAT secret is not set."
            exit 1
          fi
          gh release edit "$TAG_NAME" --repo "$REPO" --draft=false --prerelease=false --latest
