name: Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21

      - name: Gradle caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package Windows ".msi" distribution
        run: ./gradlew :desktop:packageReleaseMsi

      - name: Rename MSI Artifact
        shell: cmd
        run: |
          setlocal enabledelayedexpansion

          set "pattern=hammer-*.msi"
          set "newName=hammer.msi"
          set "foundFile="

          for /r %%i in (%pattern%) do (
            set "foundFile=%%i"
          )

          if defined foundFile (
          echo Renaming !foundFile! to %newName%
            ren "!foundFile!" "%newName%"
          ) else (
            echo No file matching pattern found.
          )

          endlocal

          echo Successfully renamed file to "hammer.msi"

      - name: Package Windows ".exe" distribution
        run: ./gradlew :desktop:packageReleaseExe

      - name: Rename EXE Artifact
        shell: cmd
        run: |
          setlocal enabledelayedexpansion

          set "pattern=hammer-*.exe"
          set "newName=hammer.exe"
          set "foundFile="

          for /r %%i in (%pattern%) do (
            set "foundFile=%%i"
          )

          if defined foundFile (
          echo Renaming !foundFile! to %newName%
            ren "!foundFile!" "%newName%"
          ) else (
            echo No file matching pattern found.
          )

          endlocal

          echo Successfully renamed file to "hammer.exe"

      - name: Create Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}\\desktop\\build\\installers\\main-release\\msi\\hammer.msi,${{ github.workspace }}\\desktop\\build\\installers\\main-release\\exe\\hammer.exe"

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download and setup JBR
        run: |
          # Download JetBrains Runtime 21
          wget -q https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-21.0.5-linux-x64-b631.3.tar.gz
          tar -xzf jbr_jcef-21.0.5-linux-x64-b631.3.tar.gz
          echo "JAVA_HOME=$GITHUB_WORKSPACE/jbr_jcef-21.0.5-linux-x64-b631.3" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/jbr_jcef-21.0.5-linux-x64-b631.3/bin" >> $GITHUB_PATH

      - name: Gradle caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package Linux ".deb" distribution
        run: ./gradlew :desktop:packageReleaseDeb

      - name: Rename DEB Artifact
        run: |
          cd $GITHUB_WORKSPACE/desktop/build/installers/main-release/deb/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name 'hammer_*.deb' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi

          # rename the file to "hammer.deb"
          mv "$file" "${file/hammer_*/hammer}.deb"

          echo "File renamed successfully."

      - name: Package Linux ".rpm" distribution
        run: ./gradlew :desktop:packageReleaseRpm

      - name: Rename RPM Artifact
        run: |
          cd $GITHUB_WORKSPACE/desktop/build/installers/main-release/rpm/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name 'hammer-*.rpm' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi

          # rename the file to "hammer.rpm"
          mv "$file" "hammer.rpm"

          echo "File renamed successfully."

      - name: Build Linux ".appimage" distribution
        run: ./gradlew buildDistAppImage

      - name: Create Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/desktop/build/installers/main-release/deb/hammer.deb,${{ github.workspace }}/desktop/build/installers/main-release/rpm/hammer.rpm,${{ github.workspace }}/desktop/build/installers/main-release/appimage/hammer.AppImage"

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21

      - name: Gradle caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package MacOS ".dmg" distribution
        run: ./gradlew :desktop:packageReleaseDmg

      - name: Rename DMG Artifact
        run: |
          cd $GITHUB_WORKSPACE/desktop/build/installers/main-release/dmg/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name 'hammer-*.dmg' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi

          # rename the file to "hammer.dmg"
          mv "$file" "${file/hammer-*/hammer}.dmg"

          echo "File renamed successfully."

      - name: Package MacOS ".pkg" distribution
        run: ./gradlew :desktop:packageReleasePkg

      - name: Rename PKG Artifact
        run: |
          cd $GITHUB_WORKSPACE/desktop/build/installers/main-release/pkg/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name 'hammer-*.pkg' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi

          # rename the file to "hammer.pkg"
          mv "$file" "hammer.pkg"

          echo "File renamed successfully."
          echo "Contents of pkg directory:"
          ls -la

      - name: Create Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/desktop/build/installers/main-release/dmg/hammer.dmg,${{ github.workspace }}/desktop/build/installers/main-release/pkg/hammer.pkg"

  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21

      - name: Gradle caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Package Server distributions
        run: ./gradlew :server:assembleDist

      - name: Rename tar Artifact
        run: |
          file=$(find . -type f -name 'server-*.tar' -print -quit)
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi
          mv "$file" "${file/server-*/server}.tar"
          echo "File renamed successfully."
      - name: Rename zip Artifact
        run: |
          file=$(find . -type f -name 'server-*.zip' -print -quit)
          if [ -z "$file" ]; then
            echo "Error: no file matching the pattern found."
            exit 1
          fi
          mv "$file" "${file/server-*/server}.zip"
          echo "File renamed successfully."

      - name: Create Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/server/build/distributions/*.*"

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21

      - name: Gradle caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore key
        working-directory: ${{ github.workspace }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" > release.keystore.asc
          echo ${{ secrets.RELEASE_STORE_PASSWORD_BASE64 }} | base64 -d > passphrase
          gpg -d --passphrase-file passphrase --batch release.keystore.asc > release.keystore

      - name: Build APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :android:assembleRelease

      - name: Rename APK Artifact
        run: |
          cd $GITHUB_WORKSPACE/android/build/outputs/apk/release/
          # find the file matching the pattern and store its name in a variable
          file=$(find . -type f -name '*.apk' -print -quit)

          # if no file was found, exit with an error message
          if [ -z "$file" ]; then
            echo "Error: no APK file found."
            exit 1
          fi

          # rename the file to "hammer.apk"
          mv "$file" "hammer.apk"

          echo "File renamed successfully."

      - name: Create Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/android/build/outputs/apk/release/hammer.apk"

  snap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download and setup JBR
        run: |
          # Download JetBrains Runtime 21
          wget -q https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-21.0.5-linux-x64-b631.3.tar.gz
          tar -xzf jbr_jcef-21.0.5-linux-x64-b631.3.tar.gz
          echo "JAVA_HOME=$GITHUB_WORKSPACE/jbr_jcef-21.0.5-linux-x64-b631.3" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/jbr_jcef-21.0.5-linux-x64-b631.3/bin" >> $GITHUB_PATH

      - name: Grant Permission to Execute
        run: chmod +x gradlew

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build-snap

      - name: Rename Snap Artifact
        run: |
          mv "${{ steps.build-snap.outputs.snap }}" hammer.snap
          echo "File renamed successfully."

      - name: Create Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: hammer.snap

  flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download and setup JBR
        run: |
          # Download JetBrains Runtime 21
          wget -q https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-21.0.5-linux-x64-b631.3.tar.gz
          tar -xzf jbr_jcef-21.0.5-linux-x64-b631.3.tar.gz
          echo "JAVA_HOME=$GITHUB_WORKSPACE/jbr_jcef-21.0.5-linux-x64-b631.3" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/jbr_jcef-21.0.5-linux-x64-b631.3/bin" >> $GITHUB_PATH

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak SDK and runtime
        run: |
          flatpak install --user -y flathub org.freedesktop.Platform//24.08
          flatpak install --user -y flathub org.freedesktop.Sdk//24.08
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.openjdk21//24.08

      - name: Grant Permission to Execute
        run: chmod +x gradlew

      - name: Build Flatpak
        run: ./gradlew buildDistFlatpak

      - name: Create Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          artifacts: "${{ github.workspace }}/desktop/build/installers/main/flatpak/hammer.flatpak"

  set-release-body:
    runs-on: ubuntu-latest
    needs: [ windows, linux, macos, android, server, snap, flatpak ]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch tags
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Get last tag message
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          TAG_MESSAGE=$(git tag -n90 --format='%(contents)' "$TAG_NAME" )
          
          echo "Tag: $TAG_NAME"
          echo -e "Tag message:\n$TAG_MESSAGE"
          
          echo "tag_message<<EOF" >> $GITHUB_ENV
          echo "$TAG_MESSAGE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set release body
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          allowUpdates: true
          body: ${{ env.tag_message }}
