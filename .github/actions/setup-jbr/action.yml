name: 'Set up JBR'
description: 'Set up the JetBrains Runtime, retrying through transient GitHub rate limits on the JBR download.'

inputs:
  token:
    description: 'GitHub token used for authenticated JBR downloads.'
    required: true
  cache:
    description: "Build tool to cache dependencies for (passed through to setup-java's cache input). Empty disables caching."
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up JBR (attempt 1)
      id: attempt1
      uses: actions/setup-java@v5
      continue-on-error: true
      with:
        distribution: 'jetbrains'
        java-version: 21
        token: ${{ inputs.token }}
        cache: ${{ inputs.cache }}

    - name: Back off before retry
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Set up JBR (attempt 2)
      id: attempt2
      if: steps.attempt1.outcome == 'failure'
      uses: actions/setup-java@v5
      continue-on-error: true
      with:
        distribution: 'jetbrains'
        java-version: 21
        token: ${{ inputs.token }}
        cache: ${{ inputs.cache }}

    - name: Back off before final retry
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      shell: bash
      run: sleep 60

    # Final attempt: no continue-on-error, so a persistent failure still fails the job.
    - name: Set up JBR (attempt 3)
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      uses: actions/setup-java@v5
      with:
        distribution: 'jetbrains'
        java-version: 21
        token: ${{ inputs.token }}
        cache: ${{ inputs.cache }}
