# Daemon JVM criteria. Vendor is intentionally unspecified so the daemon
# runs on any locally-installed JDK 21 (F-Droid's openjdk-21, Temurin, JBR,
# etc.). Avoid running `./gradlew updateDaemonJvm` without arguments — it
# will repopulate this file with vendor=ORACLE and foojay URLs, which
# breaks the F-Droid build.
toolchainVersion=21
