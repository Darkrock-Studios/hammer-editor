# Example Hammer server config for Docker.
#
# Mount this file at /data/hammer_data/config.toml (see docker-compose.yml) or
# leave it out entirely to run with defaults. Every value below is optional.
#
# Full reference: docs/HOW-TO-RUN-A-SERVER.md

# Public name shown to users. Set this to the hostname clients will connect to.
host = "hammer.example.com"

# Plain HTTP port inside the container. Matches the port published in
# docker-compose.yml and EXPOSE in the Dockerfile. Leave at 8080 unless you also
# change those.
port = 8080

# The externally visible base URL, used for links placed in emails. Set this when
# running behind a reverse proxy so generated links use the right scheme/host.
# publicUrl = "https://hammer.example.com"

# TLS: the recommended Docker setup terminates TLS at a reverse proxy in front of
# the container and forwards plain HTTP here. In that case leave sslCert unset and
# do NOT publish 8080 to the public internet directly.
#
# To have Hammer terminate TLS itself, mount your certificate into the container,
# publish 443, and point at the PEM files (from e.g. Let's Encrypt):
# sslPort = 443
# [sslCert]
# certChainPath = "/data/hammer_data/certs/fullchain.pem"
# privateKeyPath = "/data/hammer_data/certs/privkey.pem"

# Storage defaults to an in-process (embedded) PostgreSQL under
# /data/hammer_data/pgdata — no external database needed. To use an external
# PostgreSQL instead, uncomment and fill in:
# [storage]
# type = "remote"
# [storage.remote]
# host = "db"
# port = 5432
# database = "hammer"
# user = "hammer"
# password = "change-me"
# useSsl = false
